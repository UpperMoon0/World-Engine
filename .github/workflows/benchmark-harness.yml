name: Benchmark harness
on:
  pull_request:
    paths:
      - 'common/src/main/java/**'
      - 'worldengine_rapier/src/main/**'
      - 'neoforge/src/main/java/**'
      - 'benchmark/**'
      - 'tools/*benchmark_sable.py'
      - 'settings.gradle'
      - '.github/workflows/benchmark-harness.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Smoke validation or full paired performance comparison'
        type: choice
        options: [smoke, full]
        default: smoke
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: python -m unittest discover -s tools -p 'test_benchmark_sable.py'
      - name: Real paired baseline and addon comparison
        env:
          FULL_COMPARISON: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
        run: |
          if [ "$FULL_COMPARISON" = "true" ]; then
            python tools/benchmark_sable.py --trials 5 --warmup 300 --ticks 300
          else
            python tools/benchmark_sable.py --trials 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-comparison-${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' && 'full' || 'smoke' }}
          path: |
            build/sable-comparison/**/*.json
            build/sable-comparison/**/*.log
          retention-days: 7
