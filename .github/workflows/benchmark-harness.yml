name: Benchmark harness
on:
  pull_request:
    paths:
      - 'common/src/main/java/**'
      - 'worldengine_rapier/src/main/**'
      - 'neoforge/src/main/java/**'
      - 'benchmark/**'
      - 'tools/*benchmark_sable.py'
      - 'settings.gradle'
      - '.github/workflows/benchmark-harness.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: python -m unittest discover -s tools -p 'test_benchmark_sable.py'
      - name: Real baseline and addon harness smoke (no speedup claim)
        run: python tools/benchmark_sable.py --trials 1 --scenarios idle supported64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-comparison-smoke
          path: |
            build/sable-comparison/**/*.json
            build/sable-comparison/**/*.log
          retention-days: 7
