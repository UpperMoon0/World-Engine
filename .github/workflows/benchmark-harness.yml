name: Benchmark harness
on:
  pull_request:
    paths:
      - 'common/src/main/java/**'
      - 'worldengine_rapier/src/main/**'
      - 'neoforge/src/main/java/**'
      - 'benchmark/**'
      - 'tools/*benchmark_sable.py'
      - 'tools/test_jni_signatures.py'
      - 'settings.gradle'
      - '.github/workflows/benchmark-harness.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Smoke validation or full paired performance comparison'
        type: choice
        options: [smoke, full]
        default: smoke
jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Real paired baseline and addon comparison
        run: python tools/benchmark_sable.py --trials 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-comparison-smoke
          path: |
            build/sable-comparison/**/*.json
            build/sable-comparison/**/*.log
          retention-days: 7

  full-workload:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [idle, supported64, supported256, active64, edits64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Five full pairs on this workload's runner
        run: python tools/benchmark_sable.py --trials 5 --warmup 300 --ticks 300 --scenarios ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-comparison-shard-${{ matrix.scenario }}
          path: |
            build/sable-comparison/**/*.json
            build/sable-comparison/**/*.log
          retention-days: 7

  full-comparison:
    needs: full-workload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: sable-comparison-shard-*
          path: build/shards
      - name: Validate all five workloads and retain their individual provenance
        run: python tools/merge_benchmark_sable.py build/shards build/full-comparison --run-id ci-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: sable-comparison-full
          path: build/full-comparison/*.json
          retention-days: 7
