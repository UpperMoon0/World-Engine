name: Build Rust Natives
on:
  push:
    branches:
      - main
    paths:
      - 'worldengine_rapier/src/main/rust/**'
      - '.github/workflows/build-rust.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/worldengine_rapier/build/cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('worldengine_rapier/src/main/rust/**/Cargo.lock') }}

      - name: Build native toolchain containers
        run: ./gradlew worldengine_rapier:buildImages

      - name: Native correctness tests
        run: |
          docker run --rm \
            -v "$PWD/worldengine_rapier/src/main/rust:/io" \
            -v "$PWD/worldengine_rapier/build/cargo/git:/usr/local/cargo/git" \
            -v "$PWD/worldengine_rapier/build/cargo/registry:/usr/local/cargo/registry" \
            -w /io/rapier worldengine-build-zigbuild cargo test --lib -- --test-threads=1

      - name: Build all six release native targets
        run: ./gradlew worldengine_rapier:buildRustNatives

      - name: Take ownership of the workspace
        run: sudo chown -R $USER:$USER .

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add worldengine_rapier/src/main/resources/natives/worldengine_rapier/worldengine_rapier_binaries.zip.l4z
          git commit -m "Automated build rust natives" || echo "No changes to commit"
          git push
