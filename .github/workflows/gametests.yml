name: build
on:
  workflow_dispatch:
  push:
    paths:
      - 'common/src/main/java/**'
      - 'fabric/src/main/java/**'
      - 'neoforge/src/main/java/**'
      - '**/gradle.properties'
      - '**/settings.gradle'
      - '**/build.gradle'
      - '.github/workflows/gametests.yml'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-01-29 --profile minimal

      - name: Test and build current Linux native source
        working-directory: worldengine_rapier/src/main/rust
        run: |
          cargo test --locked -p worldengine_rapier --lib -- --test-threads=1
          cargo build --locked -p worldengine_rapier --release
          cp target/release/libworldengine_rapier.so ../resources/natives/worldengine_rapier/worldengine_rapier_x86_64_linux.so

      - name: Package current Linux native for game tests
        run: ./gradlew worldengine_rapier:packRustNatives

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Run game tests
        run: ./gradlew neoforge:runGameTest
