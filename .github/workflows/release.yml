name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties | head -n 1 | tr -d '\r' | xargs)"
          test -n "$version"
          test -f "changelog/$version.md"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: ./gradlew build neoforge:runGameTest --no-daemon
      - name: Stage release jars
        shell: bash
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp "fabric/build/libs/world-engine-fabric-${MOD_VERSION}.jar" release-artifacts/
          cp "neoforge/build/libs/world-engine-neoforge-${MOD_VERSION}.jar" release-artifacts/
      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: world-engine-${{ steps.version.outputs.version }}
          path: release-artifacts/*.jar
          if-no-files-found: error

  github-release:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version=//p' gradle.properties | head -n 1 | tr -d '\r' | xargs)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: world-engine-${{ steps.version.outputs.version }}
          path: release-artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: World Engine ${{ steps.version.outputs.version }}
          body_path: changelog/${{ steps.version.outputs.version }}.md
          files: release-artifacts/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  curseforge:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Fabric
            file: world-engine-fabric
          - loader: NeoForge
            file: world-engine-neoforge
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version=//p' gradle.properties | head -n 1 | tr -d '\r' | xargs)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: world-engine-${{ steps.version.outputs.version }}
          path: release-artifacts
      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: '1671915'
          MOD_VERSION: ${{ steps.version.outputs.version }}
          LOADER: ${{ matrix.loader }}
          FILE_PREFIX: ${{ matrix.file }}
          MINECRAFT_VERSION: '1.21.1'
          JAVA_VERSION_NAME: 'Java 21'
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required GitHub secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi

          jar_path="release-artifacts/${FILE_PREFIX}-${MOD_VERSION}.jar"
          if [[ ! -f "$jar_path" ]]; then
            echo "Release jar not found at $jar_path" >&2
            exit 1
          fi

          changelog_path="changelog/${MOD_VERSION}.md"
          if [[ ! -f "$changelog_path" ]]; then
            echo "Release changelog not found at $changelog_path" >&2
            exit 1
          fi

          game_version_names="$(jq -cn \
            --arg minecraftVersion "$MINECRAFT_VERSION" \
            --arg loaderName "$LOADER" \
            --arg javaVersionName "$JAVA_VERSION_NAME" \
            '[$minecraftVersion, $loaderName, $javaVersionName, "Client", "Server"]')"

          available_versions="$(curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            'https://minecraft.curseforge.com/api/game/versions')"
          while IFS= read -r version_name; do
            if ! jq -e --arg name "$version_name" 'any(.[]; .name == $name)' \
              <<< "$available_versions" >/dev/null; then
              echo "CurseForge does not recognize game version tag: ${version_name}" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$game_version_names")

          changelog="$(<"$changelog_path")"
          relations='{"projects":[{"slug":"sable","type":"requiredDependency"}]}'
          display_name="World Engine ${MOD_VERSION} - ${LOADER} ${MINECRAFT_VERSION}"

          metadata="$(jq -cn \
            --arg changelog "$changelog" \
            --arg displayName "$display_name" \
            --argjson gameVersionNames "$game_version_names" \
            --argjson relations "$relations" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release",
              relations: $relations
            }')"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${jar_path}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"
          if [[ "$http_status" =~ ^2 ]]; then
            file_id="$(jq -er '.id' <<< "$response")"
            echo "Published ${jar_path} to CurseForge as file ID ${file_id}."
          elif grep -Eqi 'already|duplicate' <<< "$response"; then
            echo "CurseForge already has ${jar_path}; treating this retry as successful."
          else
            echo "CurseForge upload failed with HTTP ${http_status}: ${response}" >&2
            exit 1
          fi
